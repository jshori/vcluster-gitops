apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: my-gitops-tenant
  namespace: p-default
spec:
  displayName: my-gitops-tenant
  owner:
    user: admin
  template:
    helmRelease:
      chart:
        version: 0.35.0
      values: |
        sync:
          toHost:
            ingresses:
              enabled: true
        controlPlane:
          coredns:
            enabled: true
            embedded: true
          backingStore:
            etcd:
              embedded:
                enabled: true
        integrations:
          argoCD:
            enabled: true
            connector: local-test-argocd
        deploy:
          argoCD:
            applications:
              - name: grafana-doc-test
                displayName: "Grafana Doc Test"
                target: vcluster
                inline:
                  source:
                    repoURL: "https://github.com/argoproj/argocd-example-apps.git"
                    targetRevision: HEAD
                    path: guestbook
                  project: default
                  syncPolicy:
                    automated:
                      prune: true
                      selfHeal: true
                  destination:
                    namespace: default
