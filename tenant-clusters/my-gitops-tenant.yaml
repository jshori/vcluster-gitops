apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: my-gitops-tenant
  namespace: p-default
spec:
  displayName: my-gitops-tenant
  template:
    helmRelease:
      chart:
        version: 0.35.0
      values: |
        sync:
          toHost:
            ingresses:
              enabled: true
        controlPlane:
          coredns:
            enabled: true
            embedded: true
          backingStore:
            etcd:
              embedded:
                enabled: true
        integrations:
          argoCD:
            enabled: true
            connector: local-test-argocd
